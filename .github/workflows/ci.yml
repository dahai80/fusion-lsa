name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # ubuntu + mlx Linux CPU wheel. Hosted macOS runners were auto-cancelled
    # at queue time on this account (5 consecutive runs, 0 steps executed,
    # bisected with an ubuntu-vs-macos echo pair), so the gate runs where it
    # actually executes; the ward merge already runs on the CPU stream and
    # the page-close cache trims degrade to no-ops without mx.metal.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: pip install -e ".[test]"
      - name: Lint
        run: |
          pip install ruff
          ruff check .
      - name: Run tests
        run: python -m pytest tests/ -q --durations=10
