[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fusion-lsa"
version = "0.2.0"
description = "Latent Sparse Attention ported to MLX/Metal for the Fusion monorepo"
requires-python = ">=3.11"
dependencies = [
    # macOS: metal backend ships inside the mlx wheel. Linux: the plain mlx
    # wheel is a 0-byte stub dispatching to mlx-cuda/mlx-cpu extras - CI runs
    # the CPU backend on hosted ubuntu.
    "mlx>=0.29; platform_system == 'Darwin'",
    "mlx[cpu]>=0.29; platform_system == 'Linux'",
    "numpy",
    "safetensors",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
    "torch",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
