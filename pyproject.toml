[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fusion-lsa"
version = "0.1.0"
description = "Latent Sparse Attention ported to MLX/Metal for the Fusion monorepo"
requires-python = ">=3.11"
dependencies = [
    "mlx>=0.29",
    "numpy",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
    "torch",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
